                      <div className="flex justify-between text-slate-500">
                        <span>Est. Taxes (9.5%)</span>
                        <span>${taxAmount.toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between font-extrabold text-sm text-slate-900 pt-1 border-t border-slate-200">
                        <span>Total</span>
                        <span>${cartTotal.toFixed(2)}</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <div>
                        <label className="block text-[10px] font-bold text-slate-600 mb-0.5">Your Name</label>
                        <input
                          type="text"
                          name="customerName"
                          required
                          placeholder="Name"
                          className="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-teal-500"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-slate-600 mb-0.5">Phone #</label>
                        <input
                          type="tel"
                          name="phone"
                          required
                          placeholder="Phone"
                          className="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-teal-500"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[10px] font-bold text-slate-600 mb-0.5">Order Type</label>
                        <select
                          name="type"
                          className="w-full text-xs px-2 py-1.5 rounded-lg border border-slate-300 bg-white focus:outline-none"
                        >
                          <option value="Pickup">Store Pickup</option>
                          <option value="Dine-In">Dine-In Table</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-slate-600 mb-0.5">Special Request</label>
                        <input
                          type="text"
                          name="notes"
                          placeholder="Optional notes..."
                          className="w-full text-xs px-2 py-1.5 rounded-lg border border-slate-300 focus:outline-none"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-xl text-xs font-bold shadow-md transition-all text-center"
                    >
                      Confirm & Pay (${cartTotal.toFixed(2)})
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {}
          {orderSuccess && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl border border-slate-100 animate-fade-in space-y-3">
                <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto text-emerald-600">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                  </svg>
                </div>

                <div>
                  <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider bg-emerald-50 px-2 py-0.5 rounded-full">
                    Order Received!
                  </span>
                  <h3 className="text-xl font-extrabold text-slate-900 mt-1">
                    {orderSuccess.id}
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Thank you, <span className="font-bold text-slate-700">{orderSuccess.customerName}</span>! Kevin is preparing your handcrafted tea now.
                  </p>
                </div>

                <div className="p-3 bg-slate-50 rounded-2xl text-left border border-slate-200 text-xs space-y-1">
                  <div className="flex justify-between font-bold text-slate-800">
                    <span>Estimated Prep Time:</span>
                    <span className="text-teal-600">8 - 12 Mins</span>
                  </div>
                  <div className="flex justify-between text-slate-500 text-[11px]">
                    <span>Total Paid:</span>
                    <span>${orderSuccess.total.toFixed(2)}</span>
                  </div>
                </div>

                <button
                  onClick={() => setOrderSuccess(null)}
                  className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition-colors"
                >
                  Back to Menu
                </button>
              </div>
            </div>
          )}

          {}
          {/* BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-20 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg">
            <div className="max-w-md mx-auto grid grid-cols-5 py-2 px-1 text-center">
              
              <button
                onClick={() => setActiveTab('home')}
                className={`flex flex-col items-center py-1 rounded-xl transition-all ${
                  activeTab === 'home' ? 'text-teal-600 font-extrabold scale-105' : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span className="text-[10px]">Home</span>
              </button>

              <button
                onClick={() => setActiveTab('menu')}
                className={`flex flex-col items-center py-1 rounded-xl transition-all ${
                  activeTab === 'menu' ? 'text-teal-600 font-extrabold scale-105' : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                <span className="text-[10px]">Menu</span>
              </button>

              <button
                onClick={() => setActiveTab('offers')}
                className={`flex flex-col items-center py-1 rounded-xl transition-all ${
                  activeTab === 'offers' ? 'text-pink-600 font-extrabold scale-105' : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
                </svg>
                <span className="text-[10px]">Offers</span>
              </button>

              <button
                onClick={() => setActiveTab('feedback')}
                className={`flex flex-col items-center py-1 rounded-xl transition-all ${
                  activeTab === 'feedback' ? 'text-purple-600 font-extrabold scale-105' : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 4.418 9 8z" />
                </svg>
                <span className="text-[10px]">Reviews</span>
              </button>

              <button
                onClick={() => setActiveTab('owner')}
                className={`flex flex-col items-center py-1 rounded-xl transition-all ${
                  activeTab === 'owner' ? 'text-indigo-600 font-extrabold scale-105' : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
              >
                <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" />
                </svg>
                <span className="text-[10px]">Owner</span>
              </button>

            </div>
          </nav>

        </div>
      );
    }

    const { useState, useEffect } = React;
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
