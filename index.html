    function App() {
      // Navigation state
      const [activeTab, setActiveTab] = useState('home'); // 'home', 'menu', 'feedback', 'owner', 'offers'
      const [selectedCategory, setSelectedCategory] = useState('All');
      
      // Order / Cart State
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [customizingItem, setCustomizingItem] = useState(null);
      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('chameleaTea_orders');
        return saved ? JSON.parse(saved) : INITIAL_ORDERS;
      });
      const [orderSuccess, setOrderSuccess] = useState(null);

      // Feedback State
      const [feedbacks, setFeedbacks] = useState(() => {
        const saved = localStorage.getItem('chameleaTea_feedbacks');
        return saved ? JSON.parse(saved) : INITIAL_FEEDBACK;
      });
      const [feedbackForm, setFeedbackForm] = useState({
        name: '',
        rating: 5,
        category: 'Taste & Quality',
        comment: '',
        drink: 'Chameleon Signature Brown Sugar'
      });
      const [feedbackSubmitted, setFeedbackSubmitted] = useState(false);

      // Owner Reply State
      const [replyingFeedbackId, setReplyingFeedbackId] = useState(null);
      const [replyText, setReplyText] = useState('');

      // Ticket System State
      const [tickets, setTickets] = useState(() => {
        const saved = localStorage.getItem('chameleaTea_tickets');
        return saved ? JSON.parse(saved) : [];
      });
      const [ticketForm, setTicketForm] = useState({
        email: '',
        phone: '',
        firstName: '',
        lastName: '',
        type: 'Complaint',
        message: ''
      });
      const [ticketSubmitted, setTicketSubmitted] = useState(false);
      const [replyingTicketId, setReplyingTicketId] = useState(null);
      const [ticketReplyText, setTicketReplyText] = useState('');

      // Owner Auth State
      const [isOwnerAuthenticated, setIsOwnerAuthenticated] = useState(false);
      const [ownerPinInput, setOwnerPinInput] = useState('');
      const [pinError, setPinError] = useState('');
      const [ownerTab, setOwnerTab] = useState('orders'); // 'orders', 'feedback', 'stats', 'tickets'
      const [loginAttempts, setLoginAttempts] = useState(0);
      const [lockoutTime, setLockoutTime] = useState(null);

      // Google Sheets Export State
      const [isExporting, setIsExporting] = useState(false);
      const [exportMessage, setExportMessage] = useState('');

      // Session timeout - auto logout after 30 minutes of inactivity
      useEffect(() => {
        if (!isOwnerAuthenticated) return;

        let timeout;
        const resetTimeout = () => {
          clearTimeout(timeout);
          timeout = setTimeout(() => {
            setIsOwnerAuthenticated(false);
            alert('⏰ Session expired due to inactivity. Please login again.');
          }, 30 * 60 * 1000); // 30 minutes
        };

        resetTimeout();
        const events = ['mousemove', 'keypress', 'click', 'scroll'];
        events.forEach(event => window.addEventListener(event, resetTimeout));

        return () => {
          clearTimeout(timeout);
          events.forEach(event => window.removeEventListener(event, resetTimeout));
        };
      }, [isOwnerAuthenticated]);

      // Privacy notice on first visit
      useEffect(() => {
        if (!localStorage.getItem('privacy_acknowledged')) {
          alert('🔒 Privacy Notice: This system stores customer data locally in your browser. Please ensure you are on a secure, private device.');
          localStorage.setItem('privacy_acknowledged', 'true');
        }
      }, []);

      // Persist data to localStorage whenever it changes
      useEffect(() => {
        localStorage.setItem('chameleaTea_orders', JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem('chameleaTea_feedbacks', JSON.stringify(feedbacks));
      }, [feedbacks]);

      useEffect(() => {
        localStorage.setItem('chameleaTea_tickets', JSON.stringify(tickets));
      }, [tickets]);

      // Customization Modal Temp State
      const [currentOptions, setCurrentOptions] = useState({
        size: 'Regular',
        sweetness: '50%',
        ice: 'Regular Ice',
        toppings: [],
        qty: 1
      });

      // Handle category filtering
      const categories = ['All', 'Milk Teas', 'Fruit Teas', 'Slush & Ice'];
      const filteredMenu = selectedCategory === 'All' 
        ? INITIAL_MENU 
        : INITIAL_MENU.filter(item => item.category === selectedCategory);

      const handleOwnerSubmitReply = (feedbackId) => {
        if (!replyText.trim()) return;

        setFeedbacks(feedbacks.map(fb => {
          if (fb.id === feedbackId) {
            return {
              ...fb,
              ownerResponse: {
                date: 'Just now',
                comment: replyText.trim()
              }
            };
          }
          return fb;
        }));

        setReplyingFeedbackId(null);
        setReplyText('');
      };

      const handleTicketSubmit = (e) => {
        e.preventDefault();
        
        // Input validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(ticketForm.email)) {
          alert('❌ Please enter a valid email address.');
          return;
        }
        
        const phoneRegex = /^[\d\s\-\(\)]+$/;
        if (!phoneRegex.test(ticketForm.phone) || ticketForm.phone.replace(/\D/g, '').length < 10) {
          alert('❌ Please enter a valid phone number (at least 10 digits).');
          return;
        }
        
        if (!ticketForm.message.trim() || ticketForm.message.trim().length < 10) {
          alert('❌ Please provide a detailed message (at least 10 characters).');
          return;
        }

        const newTicket = {
          id: `TK-${Date.now()}`,
          email: ticketForm.email.trim(),
          phone: ticketForm.phone.trim(),
          firstName: ticketForm.firstName.trim(),
          lastName: ticketForm.lastName.trim(),
          type: ticketForm.type,
          message: ticketForm.message.trim(),
          date: new Date().toLocaleString(),
          status: 'Open',
          ownerResponse: null
        };

        setTickets([newTicket, ...tickets]);
        setTicketSubmitted(true);
        setTicketForm({
          email: '',
          phone: '',
          firstName: '',
          lastName: '',
          type: 'Complaint',
          message: ''
        });

        setTimeout(() => setTicketSubmitted(false), 4000);
      };

      const handleTicketReply = (ticketId) => {
        if (!ticketReplyText.trim()) return;

        setTickets(tickets.map(ticket => {
          if (ticket.id === ticketId) {
            return {
              ...ticket,
              ownerResponse: {
                date: new Date().toLocaleString(),
                message: ticketReplyText.trim()
              }
            };
          }
          return ticket;
        }));

        setReplyingTicketId(null);
        setTicketReplyText('');
      };

      const exportToGoogleSheets = async () => {
        setIsExporting(true);
        setExportMessage('Creating Google Sheet...');

        try {
          // Prepare data for Google Sheets
          const dateStr = new Date().toLocaleDateString();
          const timeStr = new Date().toLocaleTimeString();
          
          // Calculate summary data
          const totalRevenue = orders.reduce((sum, o) => sum + o.total, 0);
          const completedOrders = orders.filter(o => o.status === 'Completed').length;
          const avgRating = feedbacks.length > 0 
            ? (feedbacks.reduce((sum, fb) => sum + fb.rating, 0) / feedbacks.length).toFixed(2)
            : '0';

          // Create spreadsheet data structure
          const sheetData = {
            title: `Chamele-Tea Daily Report - ${dateStr}`,
            sheets: [
              {
                properties: { title: 'Summary' },
                data: [
                  {
                    startRow: 0,
                    startColumn: 0,
                    rowData: [
                      { values: [{ userEnteredValue: { stringValue: 'CHAMELE-TEA DAILY REPORT' }, userEnteredFormat: { textFormat: { bold: true, fontSize: 16 } } }] },
                      { values: [{ userEnteredValue: { stringValue: `Generated: ${dateStr} ${timeStr}` } }] },
                      { values: [{ userEnteredValue: { stringValue: '' } }] },
                      { values: [{ userEnteredValue: { stringValue: 'BUSINESS SUMMARY' }, userEnteredFormat: { textFormat: { bold: true, fontSize: 14 } } }] },
                      { values: [{ userEnteredValue: { stringValue: 'Total Orders' } }, { userEnteredValue: { numberValue: orders.length } }] },
                      { values: [{ userEnteredValue: { stringValue: 'Completed Orders' } }, { userEnteredValue: { numberValue: completedOrders } }] },
                      { values: [{ userEnteredValue: { stringValue: 'Total Revenue' } }, { userEnteredValue: { stringValue: `$${totalRevenue.toFixed(2)}` } }] },
                      { values: [{ userEnteredValue: { stringValue: 'Average Rating' } }, { userEnteredValue: { stringValue: `${avgRating} / 5.0` } }] },
                      { values: [{ userEnteredValue: { stringValue: 'Total Feedback' } }, { userEnteredValue: { numberValue: feedbacks.length } }] },
                      { values: [{ userEnteredValue: { stringValue: 'Total Tickets' } }, { userEnteredValue: { numberValue: tickets.length } }] },
                      { values: [{ userEnteredValue: { stringValue: 'Open Tickets' } }, { userEnteredValue: { numberValue: tickets.filter(t => t.status === 'Open').length } }] },
                    ]
                  }
                ]
              },
              {
                properties: { title: 'Orders' },
                data: [
                  {
                    startRow: 0,
                    startColumn: 0,
                    rowData: [
                      {
                        values: [
                          { userEnteredValue: { stringValue: 'Order ID' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Customer Name' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Phone' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Order Type' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Status' }, userEnteredFormat: { textFormat: { bold: true } } },

                      },
                      ...orders.map(order => ({
                        values: [
                          { userEnteredValue: { stringValue: order.id } },
                          { userEnteredValue: { stringValue: order.customerName } },
                          { userEnteredValue: { stringValue: order.phone } },
                          { userEnteredValue: { stringValue: order.type } },
                          { userEnteredValue: { stringValue: order.status } },
                          { userEnteredValue: { stringValue: `$${order.total.toFixed(2)}` } },
                          { userEnteredValue: { stringValue: order.time } },
                          { userEnteredValue: { stringValue: order.items.map(item => `${item.qty}x ${item.name} (${item.size})`).join(', ') } },
                          { userEnteredValue: { stringValue: order.notes } }

                ]
              },

                data: [

                    startColumn: 0,

                        values: [

                          { userEnteredValue: { stringValue: 'Rating' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Date' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Category' }, userEnteredFormat: { textFormat: { bold: true } } },

                          { userEnteredValue: { stringValue: 'Comment' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Owner Response' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Response Date' }, userEnteredFormat: { textFormat: { bold: true } } }
                        ]
                      },
                      ...feedbacks.map(fb => ({
                        values: [
                          { userEnteredValue: { stringValue: fb.name } },
                          { userEnteredValue: { numberValue: fb.rating } },
                          { userEnteredValue: { stringValue: fb.date } },
                          { userEnteredValue: { stringValue: fb.category } },
                          { userEnteredValue: { stringValue: fb.drink } },
                          { userEnteredValue: { stringValue: fb.comment } },
                          { userEnteredValue: { stringValue: fb.ownerResponse ? fb.ownerResponse.comment : 'N/A' } },
                          { userEnteredValue: { stringValue: fb.ownerResponse ? fb.ownerResponse.date : 'N/A' } }
                        ]
                      }))
                    ]
                  }
                ]
              },
              {
                properties: { title: 'Tickets' },
                data: [
                  {
                    startRow: 0,
                    startColumn: 0,
                    rowData: [
                      {
                        values: [
                          { userEnteredValue: { stringValue: 'Ticket ID' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Type' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Status' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'First Name' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Last Name' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Email' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Phone' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Date' }, userEnteredFormat: { textFormat: { bold: true } } },
                          { userEnteredValue: { stringValue: 'Message' }, userEnteredFormat: { textFormat: { bold: true } } }
                        ]
                      },
                      ...tickets.map(ticket => ({
                        values: [
                          { userEnteredValue: { stringValue: ticket.id } },
                          { userEnteredValue: { stringValue: ticket.type } },
                          { userEnteredValue: { stringValue: ticket.status } },
                          { userEnteredValue: { stringValue: ticket.firstName } },
                          { userEnteredValue: { stringValue: ticket.lastName } },
                          { userEnteredValue: { stringValue: ticket.email } },
                          { userEnteredValue: { stringValue: ticket.phone } },
                          { userEnteredValue: { stringValue: ticket.date } },
                          { userEnteredValue: { stringValue: ticket.message } }
                        ]
                      }))
                    ]
                  }
                ]
              }
            ]
          };

          // Use Google Sheets API v4
          const response = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(sheetData)
          });

          if (!response.ok) {
            throw new Error('Failed to create Google Sheet. Using fallback CSV download.');
          }

          const result = await response.json();
          const spreadsheetUrl = result.spreadsheetUrl;

          setExportMessage('✓ Google Sheet created successfully!');
          setTimeout(() => {
            window.open(spreadsheetUrl, '_blank');
            setIsExporting(false);
            setExportMessage('');
          }, 1500);

        } catch (error) {
          console.error('Google Sheets export failed:', error);
          setExportMessage('Google Sheets unavailable. Downloading CSV instead...');
          
          // Fallback to CSV download
          setTimeout(() => {
            exportAsCSV();
            setIsExporting(false);
            setExportMessage('');
          }, 1000);
        }
      };

      const exportAsCSV = () => {
        // Prepare CSV content
        let csvContent = '';
        
        // Orders Section
        csvContent += 'DAILY ORDERS REPORT\n';
        csvContent += 'Generated: ' + new Date().toLocaleString() + '\n\n';
        csvContent += 'Order ID,Customer Name,Phone,Order Type,Status,Total,Time,Items,Notes\n';
        
        orders.forEach(order => {
          const itemsStr = order.items.map(item => 
            `${item.qty}x ${item.name} (${item.size} ${item.sweetness} ${item.ice})`
          ).join(' | ');
          
          csvContent += `"${order.id}","${order.customerName}","${order.phone}","${order.type}","${order.status}","$${order.total.toFixed(2)}","${order.time}","${itemsStr}","${order.notes}"\n`;
        });
        
        // Summary
        const totalRevenue = orders.reduce((sum, o) => sum + o.total, 0);
        const completedOrders = orders.filter(o => o.status === 'Completed').length;
        csvContent += `\nSUMMARY\n`;
        csvContent += `Total Orders,${orders.length}\n`;
        csvContent += `Completed Orders,${completedOrders}\n`;
        csvContent += `Total Revenue,$${totalRevenue.toFixed(2)}\n\n`;
        
        // Feedback Section
        csvContent += 'CUSTOMER FEEDBACK\n';
        csvContent += 'Name,Rating,Date,Category,Drink,Comment,Owner Response,Response Date\n';
        
        feedbacks.forEach(fb => {
          const ownerResp = fb.ownerResponse ? fb.ownerResponse.comment.replace(/"/g, '""') : 'N/A';
          const ownerRespDate = fb.ownerResponse ? fb.ownerResponse.date : 'N/A';
          const comment = fb.comment.replace(/"/g, '""');
          
          csvContent += `"${fb.name}",${fb.rating},"${fb.date}","${fb.category}","${fb.drink}","${comment}","${ownerResp}","${ownerRespDate}"\n`;
        });
        
        // Average rating
        const avgRating = feedbacks.length > 0 
          ? (feedbacks.reduce((sum, fb) => sum + fb.rating, 0) / feedbacks.length).toFixed(2)
          : 'N/A';
        csvContent += `\nAverage Rating,${avgRating}\n\n`;
        
        // Tickets Section
        csvContent += 'SUPPORT TICKETS\n';
        csvContent += 'Ticket ID,Type,Status,First Name,Last Name,Email,Phone,Date,Message\n';
        
        tickets.forEach(ticket => {
          const message = ticket.message.replace(/"/g, '""');
          csvContent += `"${ticket.id}","${ticket.type}","${ticket.status}","${ticket.firstName}","${ticket.lastName}","${ticket.email}","${ticket.phone}","${ticket.date}","${message}"\n`;
        });
        
        csvContent += `\nTotal Tickets,${tickets.length}\n`;
        csvContent += `Open Tickets,${tickets.filter(t => t.status === 'Open').length}\n`;
        csvContent += `Resolved Tickets,${tickets.filter(t => t.status === 'Resolved').length}\n`;
        
        // Create download
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        const dateStr = new Date().toISOString().split('T')[0];
        
        link.setAttribute('href', url);
        link.setAttribute('download', `chamele-tea-daily-report-${dateStr}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const resetOrders = () => {
        if (window.confirm('⚠️ Are you sure you want to reset all orders? This action cannot be undone.')) {
          if (window.confirm('⚠️ FINAL WARNING: All order data will be permanently deleted. Continue?')) {
            setOrders([]);
            alert('✓ All orders have been reset.');
          }
        }
      };

      const createBackup = () => {
        const backup = {
          version: '1.0',
          timestamp: new Date().toISOString(),
          businessName: 'Chamele-Tea',
          data: {
            orders,
            feedbacks,
            tickets
          }
        };
        
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().split('T')[0];
        link.href = url;
        link.download = `chamele-tea-backup-${dateStr}.json`;
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        alert('✓ Backup created successfully!');
      };

      const restoreBackup = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const backup = JSON.parse(event.target.result);
              if (window.confirm(`Restore backup from ${new Date(backup.timestamp).toLocaleString()}? This will overwrite current data.`)) {
                setOrders(backup.data.orders || []);
                setFeedbacks(backup.data.feedbacks || []);
                setTickets(backup.data.tickets || []);
                alert('✓ Backup restored successfully!');
              }
            } catch (error) {
              alert('❌ Invalid backup file. Please select a valid backup JSON file.');
            }
          };
          reader.readAsText(file);
        };
        input.click();
      };

      // Open Customize Drink Modal
      const openCustomizeModal = (item) => {
        setCustomizingItem(item);
        setCurrentOptions({
          size: 'Regular',
          sweetness: '50%',
          ice: 'Regular Ice',
          toppings: [],
          qty: 1
        });
      };

      // Calculate drink item total price
      const calculateItemPrice = (item, options) => {
        let price = item.price;
        if (options.size === 'Large') price += 1.00;
        options.toppings.forEach(tName => {
          const t = TOPPING_OPTIONS.find(top => top.name === tName);
          if (t) price += t.price;
        });
        return price * options.qty;
      };

      // Add drink to cart
      const handleAddToCart = () => {
        if (!customizingItem) return;
        const itemPrice = calculateItemPrice(customizingItem, currentOptions) / currentOptions.qty;
        
        const cartEntry = {
          cartId: Date.now() + Math.random().toString(36).substring(2, 5),
          id: customizingItem.id,
          name: customizingItem.name,
          image: customizingItem.image,
          size: currentOptions.size,
          sweetness: currentOptions.sweetness,
          ice: currentOptions.ice,
          toppings: [...currentOptions.toppings],
          unitPrice: itemPrice,
          qty: currentOptions.qty,
          totalPrice: itemPrice * currentOptions.qty
        };

        setCart(prev => [...prev, cartEntry]);
        setCustomizingItem(null);
        setIsCartOpen(true);
      };

      // Toggle Topping Selection
      const toggleTopping = (toppingName) => {
        setCurrentOptions(prev => {
          const exists = prev.toppings.includes(toppingName);
          return {
            ...prev,
            toppings: exists 
              ? prev.toppings.filter(t => t !== toppingName)
              : [...prev.toppings, toppingName]
          };
        });
      };

      // Cart Calculations
      const cartSubtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
      const taxAmount = cartSubtotal * 0.095; // 9.5% local tax
      const cartTotal = cartSubtotal + taxAmount;

      const handleCheckout = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const customerName = formData.get('customerName') || 'Guest';
        const phone = formData.get('phone') || 'N/A';
        const type = formData.get('type') || 'Pickup';
        const notes = formData.get('notes') || '';

        const newOrder = {
          id: `CT-${Math.floor(1000 + Math.random() * 9000)}`,
          customerName,
          phone,
          items: cart.map(i => ({
            name: i.name,
            size: i.size,
            sweetness: i.sweetness,
            ice: i.ice,
            toppings: i.toppings,
            price: i.unitPrice,
            qty: i.qty
          })),
          total: cartTotal,
          type,
          status: 'Preparing',
          time: 'Just now',
          notes
        };

        setOrders([newOrder, ...orders]);
        setOrderSuccess(newOrder);
        setCart([]);
        setIsCartOpen(false);

        // Trigger visual confetti celebratory effect
        if (window.confetti) {
          window.confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#10B981', '#14B8A6', '#8B5CF6', '#FACC15']
          });
        }
      };

      const handleFeedbackSubmit = (e) => {
        e.preventDefault();
        
        // Input validation
        if (!feedbackForm.comment.trim() || feedbackForm.comment.trim().length < 10) {
          alert('❌ Please provide a detailed review (at least 10 characters).');
          return;
        }

        const newEntry = {
          id: `fb-${Date.now()}`,
          name: feedbackForm.name.trim() || 'Happy Customer',
          rating: Number(feedbackForm.rating),
          date: new Date().toLocaleString(),
          category: feedbackForm.category,
          comment: feedbackForm.comment.trim(),
          drink: feedbackForm.drink,
          ownerResponse: null
        };

        setFeedbacks([newEntry, ...feedbacks]);
        setFeedbackSubmitted(true);
        setFeedbackForm({
          name: '',
          rating: 5,
          category: 'Taste & Quality',
          comment: '',
          drink: 'Chameleon Signature Brown Sugar'
        });

        setTimeout(() => setFeedbackSubmitted(false), 4000);
      };

      const handleOwnerLogin = (e) => {
        e.preventDefault();
        
        // Check if locked out
        if (lockoutTime && Date.now() < lockoutTime) {
          const minutesLeft = Math.ceil((lockoutTime - Date.now()) / 60000);
          setPinError(`🔒 Too many failed attempts. Try again in ${minutesLeft} minute${minutesLeft > 1 ? 's' : ''}.`);
          setOwnerPinInput('');
          return;
        }
        
        if (ownerPinInput === 'Chameleon_Tea123') {
          setIsOwnerAuthenticated(true);
          setLoginAttempts(0);
          setLockoutTime(null);
          setPinError('');
          setOwnerPinInput('');
        } else {
          const newAttempts = loginAttempts + 1;
          setLoginAttempts(newAttempts);
          
          if (newAttempts >= 5) {
            setLockoutTime(Date.now() + 15 * 60 * 1000); // 15 minute lockout
            setPinError('🔒 Too many failed attempts. Account locked for 15 minutes.');
          } else {
            setPinError(`❌ Incorrect password. ${5 - newAttempts} attempt${5 - newAttempts > 1 ? 's' : ''} remaining.`);
          }
          setOwnerPinInput('');
        }
      };

      const updateOrderStatus = (orderId, newStatus) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-50">
          
          {/* TOP BAR / NAVIGATION */}
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 shadow-md">
            <div className="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
              
              {/* Logo & Brand */}
              <div 
                onClick={() => setActiveTab('home')}
                className="flex items-center gap-2.5 cursor-pointer group"
              >
                <div className="relative">
                  <ChameleonMascot className="w-9 h-9 transform group-hover:scale-105 transition-transform" />
                  <span className="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-teal-500"></span>
                  </span>
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-teal-400 via-emerald-400 to-purple-400 bg-clip-text text-transparent">
                    Chamele-Tea
                  </h1>
                  <p className="text-[10px] text-slate-400 font-medium tracking-wide">CUSTOMIZABLE BOBA LAB</p>
                </div>
              </div>

              {/* Action Buttons: Cart & Owner Access */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors"
                  aria-label="Open Cart"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                  </svg>
                  {cart.length > 0 && (
                    <span className="absolute -top-1 -right-1 bg-gradient-to-r from-pink-500 to-purple-600 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center animate-pulse">
                      {cart.reduce((sum, item) => sum + item.qty, 0)}
                    </span>
                  )}
                </button>

                {/* Owner Portal Toggle */}
                <button
                  onClick={() => setActiveTab('owner')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all ${
                    activeTab === 'owner' 
                      ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg' 
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  <span>Owner</span>
                </button>
              </div>

            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-md w-full mx-auto pb-24">
            
            {}
            {activeTab === 'home' && (
              <div className="space-y-5 pt-3 px-4">
                
                {/* Hero Showcase Banner */}
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-emerald-950 to-purple-950 text-white p-5 shadow-xl border border-teal-500/30">
                  <div className="absolute right-0 top-0 bottom-0 w-1/2 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-teal-400/20 via-purple-500/10 to-transparent pointer-events-none"></div>
                  
                  <div className="relative z-10 space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="px-2.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-[10px] font-bold text-emerald-300 uppercase tracking-wider flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                        Independent & Handcrafted
                      </span>
                    </div>

                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <h2 className="text-2xl font-black text-white leading-tight">
                          Color Your Boba Experience!
                        </h2>
                        <p className="text-xs text-slate-300 mt-1 leading-relaxed">
                          Small batch teas, authentic brown sugar pearls, and tailored sweetness by Kevin Do & team.
                        </p>
                      </div>
                      <div className="p-2 bg-slate-800/80 rounded-2xl border border-teal-500/30 shrink-0">
                        <ChameleonMascot className="w-12 h-12" />
                      </div>
                    </div>

                    <div className="pt-2">
                      <button
                        onClick={() => setActiveTab('menu')}
                        className="w-full py-3 bg-gradient-to-r from-teal-400 via-emerald-500 to-teal-500 hover:opacity-95 text-slate-950 font-black rounded-xl text-xs tracking-wide uppercase shadow-lg shadow-teal-500/20 transition-all flex items-center justify-center gap-2"
                      >
                        <span>Start Customizing Your Drink</span>
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Highlights Bar */}
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-base font-black text-emerald-600">4.9★</span>
                    <p className="text-[10px] text-slate-500 font-medium">Community Rating</p>
                  </div>
                  <div className="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-base font-black text-purple-600">4 Hrs</span>
                    <p className="text-[10px] text-slate-500 font-medium">Fresh Tea Brews</p>
                  </div>
                  <div className="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-base font-black text-teal-600">100%</span>
                    <p className="text-[10px] text-slate-500 font-medium">Custom Flavors</p>
                  </div>
                </div>

                {/* Featured Popular Drinks Showcase */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between px-1">
                    <div>
                      <h3 className="font-extrabold text-slate-900 text-sm">Popular Signature Brews</h3>
                      <p className="text-[11px] text-slate-500">Customer favorites crafted daily</p>
                    </div>
                    <button
                      onClick={() => setActiveTab('menu')}
                      className="text-xs font-bold text-teal-600 hover:text-teal-700 flex items-center gap-0.5"
                    >
                      View All
                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                      </svg>
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    {INITIAL_MENU.filter(m => m.popular).slice(0, 4).map(item => (
                      <div key={item.id} className="bg-white rounded-2xl p-2.5 border border-slate-200/90 shadow-sm flex flex-col justify-between">
                        <div className="relative h-28 rounded-xl overflow-hidden mb-2 bg-slate-100">
                          <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                          <span className="absolute top-1 left-1 bg-slate-900/80 backdrop-blur-sm text-white text-[9px] font-bold px-1.5 py-0.5 rounded-md">
                            ★ {item.rating}
                          </span>
                        </div>
                        <div>
                          <h4 className="font-bold text-slate-900 text-xs leading-tight line-clamp-1">{item.name}</h4>
                          <p className="text-[10px] text-slate-500 font-medium mt-0.5">${item.price.toFixed(2)}</p>
                        </div>
                        <button
                          onClick={() => openCustomizeModal(item)}
                          className="mt-2 w-full py-1.5 bg-slate-900 hover:bg-teal-600 text-white rounded-lg text-[11px] font-bold transition-colors"
                        >
                          Order
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Front Page Customer Reviews & Owner Responses Preview */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between px-1">
                    <div>
                      <h3 className="font-extrabold text-slate-900 text-sm">Community Voices & Owner Replies</h3>
                      <p className="text-[11px] text-slate-500">Real feedback from local boba lovers</p>
                    </div>
                    <button
                      onClick={() => setActiveTab('feedback')}
                      className="text-xs font-bold text-purple-600 hover:text-purple-700 flex items-center gap-0.5"
                    >
                      All Reviews
                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                      </svg>
                    </button>
                  </div>

                  <div className="space-y-2.5">
                    {feedbacks.slice(0, 2).map(fb => (
                      <div key={fb.id} className="bg-white rounded-2xl p-3.5 border border-slate-200/90 shadow-sm space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <div className="w-7 h-7 rounded-full bg-teal-100 text-teal-800 font-extrabold text-xs flex items-center justify-center">
                              {fb.name.charAt(0)}
                            </div>
                            <div>
                              <p className="text-xs font-bold text-slate-900">{fb.name}</p>
                              <p className="text-[10px] text-slate-400">{fb.drink}</p>
                            </div>
                          </div>
                          <span className="text-xs font-bold text-amber-400">{"★".repeat(fb.rating)}</span>
                        </div>

                        <p className="text-xs text-slate-700 italic">"{fb.comment}"</p>

                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                      </svg>
                      Thank you! Your support ticket has been submitted. We'll get back to you soon!
                    </div>
                  )}

                  <form onSubmit={handleTicketSubmit} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">First Name *</label>
                        <input
                          type="text"
                          required
                          placeholder="John"
                          value={ticketForm.firstName}
                          onChange={e => setTicketForm({...ticketForm, firstName: e.target.value})}
                          className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Last Name *</label>
                        <input
                          type="text"
                          required
                          placeholder="Doe"
                          value={ticketForm.lastName}
                          onChange={e => setTicketForm({...ticketForm, lastName: e.target.value})}
                          className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email Address *</label>
                      <input
                        type="email"
                        required
                        placeholder="john.doe@example.com"
                        value={ticketForm.email}
                        onChange={e => setTicketForm({...ticketForm, email: e.target.value})}
                        className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Phone Number *</label>
                      <input
                        type="tel"
                        required
                        placeholder="555-0123"
                        value={ticketForm.phone}
                        onChange={e => setTicketForm({...ticketForm, phone: e.target.value})}
                        className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Ticket Type *</label>
                      <select
                        value={ticketForm.type}
                        onChange={e => setTicketForm({...ticketForm, type: e.target.value})}
                        className="w-full text-xs px-2.5 py-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-rose-500"
                      >
                        <option>Complaint</option>
                        <option>Suggestion</option>
                        <option>Private Review</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Your Message *</label>
                      <textarea
                        required
                        rows="3"
                        placeholder="Describe your complaint or suggestion..."
                        value={ticketForm.message}
                        onChange={e => setTicketForm({...ticketForm, message: e.target.value})}
                        className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all"
                    >
                      Submit Support Ticket
                    </button>
                  </form>
                </div>

                {/* Feedback Submission Form */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <h3 className="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-teal-500"></span>
                    Leave Feedback for Kevin & Team
                  </h3>

                  {feedbackSubmitted && (
                    <div className="mb-3 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs font-medium flex items-center gap-2 animate-fade-in">
                      <svg className="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                      </svg>
                      Thank you! Your review helps us continuously improve our drinks!
                    </div>
                  )}

                  <form onSubmit={handleFeedbackSubmit} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Your Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Alex M."
                          value={feedbackForm.name}
                          onChange={e => setFeedbackForm({...feedbackForm, name: e.target.value})}
                          className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Category</label>
                        <select
                          value={feedbackForm.category}
                          onChange={e => setFeedbackForm({...feedbackForm, category: e.target.value})}
                          className="w-full text-xs px-2.5 py-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                        >
                          <option>Taste & Quality</option>
                          <option>Service & Staff</option>
                          <option>Atmosphere & Vibe</option>
                          <option>Menu Suggestion</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Favorite Drink Ordered</label>
                      <select
                        value={feedbackForm.drink}
                        onChange={e => setFeedbackForm({...feedbackForm, drink: e.target.value})}
                        className="w-full text-xs px-2.5 py-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                      >
                        {INITIAL_MENU.map(m => (
                          <option key={m.id} value={m.name}>{m.name}</option>
                        ))}
                      </select>
                    </div>

                    {/* Star Rating Picker */}
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Rating</label>
                      <div className="flex items-center gap-1 bg-slate-50 p-2 rounded-xl border border-slate-200/80">
                        {[1, 2, 3, 4, 5].map(star => (
                          <button
                            type="button"
                            key={star}
                            onClick={() => setFeedbackForm({...feedbackForm, rating: star})}
                            className="p-1 hover:scale-110 transition-transform"
                          >
                            <svg 
                              className={`w-6 h-6 ${star <= feedbackForm.rating ? 'text-amber-400 fill-amber-400' : 'text-slate-300'}`} 
                              viewBox="0 0 24 24" 
                              stroke="currentColor" 
                              strokeWidth="1.5"
                            >
                              <path strokeLinecap="round" strokeLinejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                            </svg>
                          </button>
                        ))}
                        <span className="ml-auto text-xs font-bold text-slate-700">
                          {feedbackForm.rating} / 5 Stars
                        </span>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Your Review</label>
                      <textarea
                        required
                        rows="3"
                        placeholder="Tell us what you liked or what we can tweak..."
                        value={feedbackForm.comment}
                        onChange={e => setFeedbackForm({...feedbackForm, comment: e.target.value})}
                        className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all"
                    >
                      Submit Community Feedback
                    </button>
                  </form>
                </div>

                {/* List of Recent Feedbacks with Owner Response Display */}
                <div className="space-y-2.5">
                  <h3 className="font-bold text-slate-900 text-sm px-1">Recent Community Reviews</h3>
                  {feedbacks.map(item => (
                    <div key={item.id} className="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 space-y-2">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <div className="w-7 h-7 rounded-full bg-emerald-100 text-emerald-800 font-bold text-xs flex items-center justify-center">
                            {item.name.charAt(0)}
                          </div>
                          <div>
                            <p className="text-xs font-bold text-slate-900">{item.name}</p>
                            <p className="text-[10px] text-slate-400">{item.date}</p>
                          </div>
                        </div>
                        <div className="flex items-center text-amber-400 text-xs font-bold">
                          {"★".repeat(item.rating)}
                        </div>
                      </div>

                      <p className="text-xs text-slate-700 font-normal leading-relaxed">
                        "{item.comment}"
                      </p>

                      <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-500">
                        <span className="bg-slate-100 px-2 py-0.5 rounded-md font-medium text-slate-600">
                          {item.category}
                        </span>
                        <span className="italic">Drink: {item.drink}</span>
                      </div>

                      {/* Display Owner Response if Present */}
                      {item.ownerResponse && (
                        <div className="mt-2 p-2.5 bg-purple-50 rounded-xl border border-purple-200 text-xs space-y-1">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-purple-900 text-[11px] flex items-center gap-1">
                              <ChameleonMascot className="w-3.5 h-3.5" />
                              Kevin Do (Owner Response):
                            </span>
                            <span className="text-[9px] text-purple-400">{item.ownerResponse.date}</span>
                          </div>
                          <p className="text-[11px] text-purple-950 font-medium pl-4">
                            "{item.ownerResponse.comment}"
                          </p>
                        </div>
                      )}
                    </div>
                  ))}
                </div>

              </div>
            )}

            {/* VIEW 5: OWNER BACKEND PORTAL */}
            {activeTab === 'owner' && (
              <div className="space-y-4 pt-3 px-4">
                
                {!isOwnerAuthenticated ? (
                  /* Owner Login Screen */
                  <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-200 text-center max-w-sm mx-auto mt-6">
                    <div className="w-14 h-14 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-3">
                      <ChameleonMascot className="w-10 h-10" />
                    </div>
                    <h2 className="text-lg font-extrabold text-slate-900">Owner Dashboard</h2>
                    <p className="text-xs text-slate-500 mt-1 mb-4">
                      Enter password to manage daily operations and customer data.
                    </p>

                    <form onSubmit={handleOwnerLogin} className="space-y-3">
                      <input
                        type="password"
                        placeholder="Enter Owner Password"
                        value={ownerPinInput}
                        onChange={e => setOwnerPinInput(e.target.value)}
                        className="w-full text-sm px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-purple-600"
                        autoComplete="current-password"
                      />
                      {pinError && (
                        <p className="text-xs text-rose-500 font-medium">{pinError}</p>
                      )}
                      <button
                        type="submit"
                        className="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold transition-colors shadow-md"
                      >
                        Unlock Dashboard
                      </button>
                    </form>
                    <p className="text-[10px] text-slate-400 mt-4">
                      🔒 Secure access for authorized personnel only
                    </p>
                  </div>
                ) : (
                  /* Authenticated Owner View */
                  <div className="space-y-4">
                    
                    {/* Owner Welcome Banner */}
                    <div className="bg-slate-900 rounded-2xl p-4 text-white shadow-lg border border-slate-800">
                      <div className="flex items-center justify-between mb-3">
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Live Store Manager</span>
                          </div>
                          <h2 className="text-base font-extrabold mt-0.5">Welcome, Kevin Do! 👋</h2>
                          <p className="text-xs text-slate-400">Chamele-Tea Main Location</p>
                        </div>
                        <button
                          onClick={() => setIsOwnerAuthenticated(false)}
                          className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-colors"
                        >
                          Lock
                        </button>
                      </div>

                      {/* Owner Action Buttons */}
                      <div className="space-y-2">
                        {exportMessage && (
                          <div className={`p-2 rounded-lg text-xs font-medium text-center ${
                            exportMessage.includes('✓') 
                              ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' 
                              : 'bg-blue-50 text-blue-700 border border-blue-200'
                          }`}>
                            {exportMessage}
                          </div>
                        )}
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={exportToGoogleSheets}
                            disabled={isExporting}
                            className={`px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5 shadow-sm ${
                              isExporting ? 'opacity-50 cursor-not-allowed' : ''
                            }`}
                          >
                            {isExporting ? (
                              <>
                                <svg className="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                                <span>Creating...</span>
                              </>
                            ) : (
                              <>
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span>Export to Sheets</span>
                              </>
                            )}
                          </button>
                          <button
                            onClick={createBackup}
                            className="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5 shadow-sm"
                          >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                            </svg>
                            <span>Backup Data</span>
                          </button>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={restoreBackup}
                            className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5 shadow-sm"
                          >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                            </svg>
                            <span>Restore Backup</span>
                          </button>
                          <button
                            onClick={resetOrders}
                            className="px-3 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5 shadow-sm"
                          >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            <span>Reset Orders</span>
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Owner Navigation Sub-Tabs */}
                    <div className="grid grid-cols-4 gap-1 bg-slate-200/80 p-1 rounded-xl text-xs font-bold">
                      <button
                        onClick={() => setOwnerTab('orders')}
                        className={`py-2 rounded-lg transition-all ${
                          ownerTab === 'orders' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Orders ({orders.filter(o => o.status !== 'Completed').length})
                      </button>
                      <button
                        onClick={() => setOwnerTab('feedback')}
                        className={`py-2 rounded-lg transition-all ${
                          ownerTab === 'feedback' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Feedback ({feedbacks.length})
                      </button>
                      <button
                        onClick={() => setOwnerTab('tickets')}
                        className={`py-2 rounded-lg transition-all ${
                          ownerTab === 'tickets' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Tickets ({tickets.length})
                      </button>
                      <button
                        onClick={() => setOwnerTab('stats')}
                        className={`py-2 rounded-lg transition-all ${
                          ownerTab === 'stats' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Analytics
                      </button>
                    </div>

                    {/* SUB-TAB 1: LIVE ORDERS MANAGEMENT */}
                    {ownerTab === 'orders' && (
                      <div className="space-y-3">
                        <div className="flex items-center justify-between px-1">
                          <h3 className="font-bold text-slate-900 text-sm">Active Customer Queue</h3>
                          <span className="text-xs text-slate-500 font-medium">{orders.length} total today</span>
                        </div>

                        {orders.length === 0 ? (
                          <div className="p-8 bg-white rounded-2xl text-center border border-slate-200 text-slate-400 text-xs">
                            No active orders in queue right now.
                          </div>
                        ) : (
                          orders.map(ord => (
                            <div key={ord.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                              <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                                <div>
                                  <div className="flex items-center gap-2">
                                    <span className="font-extrabold text-sm text-slate-900">{ord.id}</span>
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                      ord.type === 'Pickup' ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-amber-50 text-amber-700 border border-amber-200'
                                    }`}>
                                      {ord.type}
                                    </span>
                                  </div>
                                  <p className="text-xs text-slate-600 font-medium mt-0.5">
                                    {ord.customerName} • <span className="text-slate-400">{ord.phone}</span>
                                  </p>
                                </div>
                                <div className="text-right">
                                  <span className="font-extrabold text-slate-900 text-sm">${ord.total.toFixed(2)}</span>
                                  <p className="text-[10px] text-slate-400">{ord.time}</p>
                                </div>
                              </div>

                              {/* Item details */}
                              <div className="py-2.5 space-y-1.5 border-b border-slate-100">
                                {ord.items.map((item, idx) => (
                                  <div key={idx} className="text-xs">
                                    <div className="flex justify-between font-bold text-slate-800">
                                      <span>{item.qty}x {item.name} ({item.size})</span>
                                      <span>${(item.price * item.qty).toFixed(2)}</span>
                                    </div>
                                    <p className="text-[11px] text-slate-500">
                                      {item.sweetness} Sugar, {item.ice}
                                      {item.toppings.length > 0 && ` + ${item.toppings.join(', ')}`}
                                    </p>
                                  </div>
                                ))}
                                {ord.notes && (
                                  <div className="mt-1 p-2 bg-amber-50/80 rounded-lg text-[11px] text-amber-800 font-medium">
                                    Note: {ord.notes}
                                  </div>
                                )}
                              </div>

                              {/* Status Action buttons */}
                              <div className="pt-2.5 flex items-center justify-between">
                                <span className="text-xs font-semibold text-slate-500">
                                  Status: <span className={`font-bold ${
                                    ord.status === 'Preparing' ? 'text-amber-600' :
                                    ord.status === 'Ready' ? 'text-teal-600' : 'text-slate-500'
                                  }`}>{ord.status}</span>
                                </span>

                                <div className="flex gap-1.5">
                                  {ord.status === 'Preparing' && (
                                    <button
                                      onClick={() => updateOrderStatus(ord.id, 'Ready')}
                                      className="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-lg transition-colors"
                                    >
                                      Mark Ready
                                    </button>
                                  )}
                                  {ord.status === 'Ready' && (
                                    <button
                                      onClick={() => updateOrderStatus(ord.id, 'Completed')}
                                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-lg transition-colors"
                                    >
                                      Complete Pickup
                                    </button>
                                  )}
                                  {ord.status === 'Completed' && (
                                    <span className="text-xs font-bold text-emerald-600 flex items-center gap-1">
                                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                                      </svg>
                                      Completed
                                    </span>
                                  )}
                                </div>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    )}

                    {/* SUB-TAB 2: OWNER FEEDBACK REVIEW & REPLY */}
                    {ownerTab === 'feedback' && (
                      <div className="space-y-3">
                        <div className="bg-white rounded-2xl p-4 border border-slate-200">
                          <h3 className="font-bold text-slate-900 text-sm mb-1">Customer Feedback & Response Console</h3>
                          <p className="text-xs text-slate-500">
                            Reply to customer reviews below. Your responses will appear directly on the public Community Reviews page!
                          </p>
                        </div>

                                            setTicketReplyText('');

                                        <span className="text-[9px] text-indigo-400">{ticket.ownerResponse.date}</span>

                                      <p className="text-[11px] text-indigo-950 leading-relaxed">"{ticket.ownerResponse.message}"</p>

                                        onClick={() => {
                                          setReplyingTicketId(ticket.id);
                                          setTicketReplyText(ticket.ownerResponse.message);
                                        }}
                                        className="mt-1 text-[10px] text-indigo-700 font-bold underline hover:text-indigo-800"

                                        Edit Response

                                        setTicketReplyText('');

                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Avg Review</p>

                            <p className="text-lg font-extrabold text-slate-900 mt-0.5">{tickets.length}</p>
                            <span className="text-[10px] text-rose-600 font-bold">

                              <span className="font-bold text-slate-900">42 cups</span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-1.5">
                              <div className="bg-teal-500 h-1.5 rounded-full" style={{ width: '85%' }}></div>
                            </div>

                            <div className="flex items-center justify-between text-xs pt-1">
                              <span className="font-medium text-slate-700">2. Hue Shift Matcha Taro</span>
                              <span className="font-bold text-slate-900">28 cups</span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-1.5">
                              <div className="bg-purple-500 h-1.5 rounded-full" style={{ width: '60%' }}></div>

                              <span className="font-bold text-slate-900">19 cups</span>

                            <div className="w-full bg-slate-100 rounded-full h-1.5">
                              <div className="bg-amber-500 h-1.5 rounded-full" style={{ width: '40%' }}></div>
                            </div>
                          </div>
                        </div>
                      </div>

                          <button
                            key={sz}

                            onClick={() => setCurrentOptions({...currentOptions, size: szValue})}

                                ? 'bg-slate-900 text-white border-slate-900 shadow-sm' 
                                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'

                            {sz}

                            className={`p-2 rounded-xl text-xs font-semibold border flex items-center justify-between text-left transition-all ${

                                ? 'bg-purple-50 border-purple-500 text-purple-900 font-bold'

                          </button>

                        type="button"
                        onClick={() => setCurrentOptions({...currentOptions, qty: currentOptions.qty + 1})}

                    </div>
                  </div>

                    className="text-slate-400 hover:text-white p-1"

                              <button
                                onClick={() => setCart(cart.filter(i => i.cartId !== cItem.cartId))}
                                className="text-slate-400 hover:text-rose-500 text-xs font-bold pl-1"

                                ✕
                              </button>
                            </div>
                            <p className="text-[11px] text-slate-500 mt-0.5">
                              {cItem.size} • {cItem.sweetness} • {cItem.ice}

                              <span className="text-xs font-bold text-slate-800">
                                Qty: {cItem.qty}
                              </span>
                              <span className="text-xs font-extrabold text-slate-900">
                                ${cItem.totalPrice.toFixed(2)}
                              </span>

                      </div>

                  )}

                {cart.length > 0 && (
